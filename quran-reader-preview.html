<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c211b"><title>আল-কোরআন · রিডার প্রিভিউ</title><style>
:root{font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#f5eddb;background:#0c211b}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;background:#0c211b;padding:14px 16px 12px;border-bottom:1px solid #385344}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{text-align:center}.title small{display:block;color:#d6c08c}.title strong{font-size:19px}button{font:inherit;cursor:pointer;border:0}header button{background:#234637;color:#f5eddb;padding:10px 12px;border-radius:12px}.options{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:14px}.options label{display:flex;align-items:center;gap:7px}input[type=checkbox]{accent-color:#d8b96e;width:19px;height:19px}.reading{max-width:720px;margin:16px auto 40px;padding:26px 20px 60px;background:#f5efdf;color:#203d2e;border-radius:16px;min-height:75vh}.surah{text-align:center;padding:14px 0 22px;border-bottom:1px solid #d8cdb6}.surah h1{font-size:22px;margin:8px 0}.surah small{color:#786b50}.bismillah{font-size:29px;line-height:2;text-align:center;direction:rtl}.verse{padding:24px 0;border-bottom:1px solid #d8cdb6}.versehead{display:flex;justify-content:space-between;align-items:center;color:#806d4b;font-size:13px}.bookmark{background:transparent;color:#806d4b;font-size:21px}.arabic{font-family:"Traditional Arabic","Amiri",serif;font-size:var(--arabic-size,31px);line-height:2.25;text-align:right;direction:rtl;margin:14px 0}.extra{margin-top:14px}.extra small{color:#8b764c;font-size:12px}.extra p{line-height:1.85;margin:5px 0 0}.foot{position:fixed;bottom:0;left:0;right:0;background:#102b22eF;color:#ead8ac;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;font-size:13px}.foot button{background:#234637;color:#ead8ac;padding:9px 12px;border-radius:9px}.notice{padding:12px;background:#274535;border-radius:10px;color:#e5d5b2;font-size:13px;line-height:1.5;margin:12px auto;max-width:720px}@media(min-width:760px){.reading{padding:34px 52px}} </style></head><body>
<header><div class="top"><button onclick="history.back()">‹ ফিরে যান</button><div class="title"><small>পারা ১ · সুরা ২</small><strong>সুরা আল-বাকারা</strong></div><button id="size" aria-label="ফন্ট বড় করুন">A+</button></div><div class="options"><label><input id="pron" type="checkbox" checked> বাংলা উচ্চারণ</label><label><input id="meaning" type="checkbox"> বাংলা অর্থ</label></div></header>
<div class="notice">UI/UX প্রিভিউ — এটি যাচাইকৃত কোরআন ডেটাবেস নয়। নিচের নমুনা পাঠকে পূর্ণ সুরা হিসেবে ব্যবহার করবেন না।</div>
<main class="reading"><section class="surah"><small>سُورَةُ الْبَقَرَةِ</small><h1>সুরা আল-বাকারা</h1><small>২৮৬ আয়াত · মাদানি</small><div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div></section><div id="verses"></div></main>
<div class="foot"><span id="position">সুরা ২ · আয়াত ১</span><button id="jump">আয়াতে যান ⌄</button></div>
<script>
const sample=[{n:1,a:"الم",p:"আলিফ-লাম-মীম।",m:"আলিফ-লাম-মীম।"},{n:2,a:"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِلْمُتَّقِينَ",p:"যালিকাল কিতাবু লা রাইবা ফীহি, হুদাল্লিল মুত্তাকীন।",m:"এ সেই কিতাব, যাতে কোনো সন্দেহ নেই; মুত্তাকিদের জন্য পথনির্দেশ।"},{n:3,a:"الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ",p:"আল্লাযীনা ইউ'মিনূনা বিল গাইবি ওয়া ইউকীমূনাস সালাতা ওয়া মিম্মা রাযাকনাহুম ইউনফিকূন।",m:"যারা অদৃশ্যে বিশ্বাস করে, সালাত প্রতিষ্ঠা করে এবং তাদের দেওয়া জীবিকা থেকে ব্যয় করে।"}];
const p=document.getElementById("pron"),m=document.getElementById("meaning");p.checked=localStorage.getItem("quran-pron")!=="false";m.checked=localStorage.getItem("quran-meaning")==="true";
function draw(){document.getElementById("verses").innerHTML=sample.map(v=>'<article class="verse" id="ayah-'+v.n+'"><div class="versehead"><span>আয়াত ২:'+v.n+'</span><button class="bookmark" aria-label="বুকমার্ক" data-n="'+v.n+'">'+(localStorage.getItem("quran-bookmark")==String(v.n)?"★":"☆")+'</button></div><div class="arabic">'+v.a+'</div>'+(p.checked?'<div class="extra"><small>বাংলা উচ্চারণ</small><p>'+v.p+'</p></div>':"")+(m.checked?'<div class="extra"><small>বাংলা অর্থ</small><p>'+v.m+'</p></div>':"")+'</article>').join("");document.querySelectorAll(".bookmark").forEach(b=>b.onclick=()=>{localStorage.setItem("quran-bookmark",b.dataset.n);draw()})}
p.onchange=()=>{localStorage.setItem("quran-pron",p.checked);draw()};m.onchange=()=>{localStorage.setItem("quran-meaning",m.checked);draw()};draw();let big=false;document.getElementById("size").onclick=()=>{big=!big;document.documentElement.style.setProperty("--arabic-size",big?"38px":"31px")};document.getElementById("jump").onclick=()=>{const n=prompt("নমুনা আয়াত নম্বর (১–৩)");if(n&&+n>=1&&+n<=3)document.getElementById("ayah-"+n).scrollIntoView({behavior:"smooth"})};
</script></body></html>
