<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#041915"><meta name="apple-mobile-web-app-capable" content="yes"><title>কুরআন রিডার • যিকির</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{color-scheme:dark;--bg:#041915;--panel:#0a3025;--line:#2d5647;--ink:#f8f7ec;--muted:#bacfc1;--gold:#e8c47e;--action:#078b59}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#041915;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;-webkit-text-size-adjust:100%;}
body{overflow:hidden}.reader{height:100dvh;max-width:680px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 48% 0%,#123c30 0%,#051c18 52%,#03130f 100%)}
.top{display:flex;align-items:center;gap:11px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.back{width:44px;height:44px;border-radius:14px;border:1px solid #52715d;background:#0f2d24;color:var(--gold);font-size:24px;text-decoration:none;display:grid;place-items:center;flex-shrink:0}
.heading{flex:1;min-width:0;text-align:center}.heading strong{display:block;font-size:17px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.heading small{font-size:11px;color:var(--gold)}
.size{width:44px;height:44px;border:1px solid #52715d;border-radius:14px;background:#0f2d24;color:var(--gold);font-size:17px}
.modes{display:flex;align-items:center;gap:4px;padding:5px 12px;border-bottom:1px solid #254a3d;flex-shrink:0}.modes .primary{flex:1;font-size:12px;color:#eee0b6;font-weight:750}.modes button{border:1px solid transparent;background:none;color:#a2bca9;border-radius:8px;padding:8px 9px;min-height:35px;font-size:12px}.modes button[aria-pressed=true]{background:#294d39;border-color:#71855b;color:#f8e0a8}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-color:#315943 transparent}.verses{padding:10px 18px 60px;max-width:600px;margin:auto}.basmala{text-align:center;padding:14px 6px;color:#e4c47d;border-bottom:1px solid #34594b;margin:0 0 3px;font-size:15px;line-height:1.8}.verse{display:flex;gap:12px;align-items:flex-start;padding:18px 0;border-bottom:1px solid #305546;line-height:1.75}.verse:last-of-type{border-bottom:0}.number{border-radius:100px;width:30px;height:30px;border:1px solid #ad935d;display:grid;place-items:center;flex-shrink:0;color:#e9c782;font-size:12px;margin-top:3px}.words{flex:1;font-size:clamp(17px,4.5vw,21px);line-height:1.85;overflow-wrap:anywhere}.arabic .verse{flex-direction:row-reverse}.arabic .words{font-family:"Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:clamp(26px,6.1vw,32px);line-height:2}.arabic .basmala{font-family:"Geeza Pro","Noto Naskh Arabic",serif;font-size:24px}.large .words{font-size:clamp(21px,5.5vw,25px)}.large.arabic .words{font-size:clamp(30px,7vw,38px)}
.endnote{text-align:center;color:#91b09e;font-size:12px;margin:32px 0 0}.tools{position:absolute;bottom:calc(80px + env(safe-area-inset-bottom));right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}.tools button{pointer-events:auto;width:40px;height:38px;border-radius:12px;background:#133b2ccf;color:#e5d195;border:1px solid #64806370;font-size:18px}
.footer{border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center;justify-content:space-between;flex-shrink:0;background:#061e17}.footer a,.footer button{font-size:13px;font-weight:750;min-height:48px;display:grid;place-items:center;text-decoration:none;border-radius:14px;padding:0 15px}.previous{border:1px solid #bca16d;background:transparent;color:#efce88}.next{border:1px solid #82dcad;background:linear-gradient(110deg,#2bb06c,#047653);color:#fff}.footer button:disabled{opacity:.36}.position{color:#cfb67b;white-space:nowrap;font-size:12px}
.pending{padding:40px 24px;text-align:center;max-width:440px;margin:auto;line-height:1.8}.pending h1{font-size:23px}.pending p{color:var(--muted)}.pending a{display:block;background:linear-gradient(100deg,#d5b372,#ffe0a3);color:#113524;padding:15px;border-radius:14px;text-decoration:none;font-weight:750;margin-top:22px}
@media(max-width:365px){.modes .primary{font-size:11px}.modes button{padding:7px 6px}.footer a,.footer button{font-size:12px;padding:0 10px}.verses{padding-left:12px;padding-right:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><div class="reader"><header class="top"><a class="back" id="back" href="./?view=quran" aria-label="কুরআন তালিকায় ফিরুন">←</a><div class="heading"><strong id="heading">সুরা</strong><small id="info"></small></div><button class="size" id="size" aria-label="লেখা বড় বা ছোট করুন">A+</button></header><div class="modes" id="modes"><span class="primary">বাংলা উচ্চারণ</span><button aria-pressed="true" data-mode="bn">উচ্চারণ</button><button aria-pressed="false" data-mode="ar">আরবি</button><button aria-pressed="false" data-mode="meaning">অর্থ</button></div><main class="scroll" id="scroll"><div id="readerBody"></div></main><div class="tools"><button id="up" aria-label="পাঠ উপরে স্ক্রল করুন">↑</button><button id="down" aria-label="পাঠ নিচে স্ক্রল করুন">↓</button></div><footer class="footer" id="footer"><a id="prev" class="previous" href="./?view=quran">← আগের</a><span class="position" id="position"></span><a id="next" class="next" href="./?view=quran">পরের সূরা →</a></footer><a id="backFoot" hidden href="./?view=quran">ফিরুন</a></div><script id="surah-data" type="application/json">[{"n":103,"title":"সুরা আল-আসর","ayat":3,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nওয়াল আসর।\nইন্নাল ইনসানা লাফী খুসর।\nইল্লাল্লাযীনা আমানূ ওয়া আমিলুস সালিহাতি, ওয়া তাওয়াসাও বিল হাক্কি, ওয়া তাওয়াসাও বিস সাবর।","arabic":["وَالْعَصْرِ","إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"],"meaning":["সময়ের শপথ।","নিশ্চয়ই মানুষ ক্ষতির মধ্যে রয়েছে।","তবে তারা নয়, যারা ঈমান এনেছে, সৎকাজ করেছে এবং পরস্পরকে সত্য ও ধৈর্যের উপদেশ দিয়েছে।"]},{"n":105,"title":"সুরা আল-ফিল","ayat":5,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nআলাম তারা কাইফা ফা‘আলা রাব্বুকা বিআসহাবিল ফীল।\nআলাম ইয়াজ‘আল কাইদাহুম ফী তাদলীল।\nওয়া আরসালা আলাইহিম তাইরান আবাবীল।\nতারমীহিম বিহিজারাতিম মিন সিজ্জীল।\nফাজা‘আলাহুম কা‘আসফিম মা‘কূল।","arabic":["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ","فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ"],"meaning":["আপনি কি দেখেননি, আপনার রব হাতিওয়ালাদের সঙ্গে কী করেছিলেন?","তিনি কি তাদের ষড়যন্ত্র ব্যর্থ করে দেননি?","আর তাদের ওপর ঝাঁকে ঝাঁকে পাখি পাঠিয়েছিলেন।","সেগুলো তাদের ওপর পোড়ামাটির পাথর নিক্ষেপ করছিল।","অতঃপর তিনি তাদের চিবানো খড়কুটোর মতো করে দিয়েছিলেন।"]},{"n":106,"title":"সুরা কুরাইশ","ayat":4,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nলি-ঈলাফি কুরাইশ।\nঈলাফিহিম রিহলাতাশ শিতাই ওয়াস সাইফ।\nফালইয়া‘বুদূ রাব্বা হাযাল বাইত।\nআল্লাযী আত‘আমাহুম মিন জূ‘ইঁ ওয়া আমানাহুম মিন খাওফ।","arabic":["لِإِيلَافِ قُرَيْشٍ","إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ"],"meaning":["কুরাইশদের অভ্যস্ততার কারণে,","তাদের শীত ও গ্রীষ্মের সফরে অভ্যস্ত থাকার কারণে,","তারা যেন এই ঘরের (কাবার) রবের ইবাদত করে,","যিনি ক্ষুধায় তাদের খাদ্য দিয়েছেন এবং ভয় থেকে নিরাপদ করেছেন।"]},{"n":107,"title":"সুরা আল-মাউন","ayat":7,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nআরাআইতাল্লাযী ইউকাযযিবু বিদ্দীন।\nফাযালিকাল্লাযী ইয়াদুউল ইয়াতীম।\nওয়ালা ইয়াহুদ্দু আলা তা‘আমিল মিসকীন।\nফাওয়াইলুল লিল মুসাল্লীন।\nআল্লাযীনা হুম আন সালাতিহিম সাহূন।\nআল্লাযীনা হুম ইউরাঊন।\nওয়া ইয়ামনা‘ঊনাল মা‘ঊন।","arabic":["أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","فَوَيْلٌ لِلْمُصَلِّينَ","الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ","الَّذِينَ هُمْ يُرَاءُونَ","وَيَمْنَعُونَ الْمَاعُونَ"],"meaning":["আপনি কি তাকে দেখেছেন, যে প্রতিদান দিবসকে অস্বীকার করে?","সেই তো এতিমকে কঠোরভাবে তাড়িয়ে দেয়,","এবং মিসকিনকে খাবার দিতে উৎসাহিত করে না।","অতএব দুর্ভোগ সেসব নামাজির জন্য,","যারা নিজেদের নামাজ সম্পর্কে উদাসীন,","যারা লোক দেখানোর জন্য কাজ করে,","এবং ছোটখাটো প্রয়োজনীয় সাহায্যও আটকে রাখে।"]},{"n":108,"title":"সুরা আল-কাউসার","ayat":3,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nইন্না আ‘তাইনা কাল-কাউসার।\nফাসাল্লি লিরাব্বিকা ওয়ানহার।\nইন্না শানিআকা হুওয়াল আবতার।","arabic":["إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ","إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"],"meaning":["নিশ্চয়ই আমি আপনাকে আল-কাউসার (অঢেল কল্যাণ) দান করেছি।","তাই আপনার রবের জন্য নামাজ পড়ুন এবং কুরবানি করুন।","নিশ্চয়ই আপনার বিদ্বেষীই কল্যাণ থেকে বিচ্ছিন্ন।"]},{"n":109,"title":"সুরা আল-কাফিরুন","ayat":6,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nকুল ইয়া আইয়ুহাল কাফিরূন।\nলা আ‘বুদু মা তা‘বুদূন।\nওয়ালা আনতুম আবিদূনা মা আ‘বুদ।\nওয়ালা আনা আবিদুম মা আবাদতুম।\nওয়ালা আনতুম আবিদূনা মা আ‘বুদ।\nলাকুম দীনুকুম ওয়ালিয়া দীন।","arabic":["قُلْ يَا أَيُّهَا الْكَافِرُونَ","لَا أَعْبُدُ مَا تَعْبُدُونَ","وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ","وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ","وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ","لَكُمْ دِينُكُمْ وَلِيَ دِينِ"],"meaning":["বলুন, হে অবিশ্বাসীরা,","তোমরা যার ইবাদত কর, আমি তার ইবাদত করি না।","আর আমি যার ইবাদত করি, তোমরাও তাঁর ইবাদত কর না।","তোমরা যার ইবাদত করেছ, আমি তার ইবাদতকারী নই।","আর আমি যার ইবাদত করি, তোমরাও তাঁর ইবাদতকারী নও।","তোমাদের ধর্ম তোমাদের জন্য এবং আমার ধর্ম আমার জন্য।"]},{"n":110,"title":"সুরা আন-নাসর","ayat":3,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nইযা জা-আ নাসরুল্লাহি ওয়াল ফাতহ।\nওয়া রাআইতান নাসা ইয়াদখুলূনা ফী দীনিল্লাহি আফওয়াজা।\nফাসাব্বিহ বিহামদি রাব্বিকা ওয়াস্তাগফিরহু, ইন্নাহু কানা তাওয়াবা।","arabic":["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا"],"meaning":["যখন আল্লাহর সাহায্য ও বিজয় আসবে,","আর আপনি দেখবেন মানুষ দলে দলে আল্লাহর দ্বীনে প্রবেশ করছে,","তখন আপনার রবের প্রশংসাসহ তাঁর পবিত্রতা ঘোষণা করুন এবং তাঁর কাছে ক্ষমা চান। নিশ্চয়ই তিনি তওবা কবুলকারী।"]},{"n":112,"title":"সুরা আল-ইখলাস","ayat":4,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nকুল হুওয়াল্লাহু আহাদ।\nআল্লাহুস সামাদ।\nলাম ইয়ালিদ ওয়ালাম ইউলাদ।\nওয়ালাম ইয়াকুল্লাহু কুফুওয়ান আহাদ।","arabic":["قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ"],"meaning":["বলুন, তিনি আল্লাহ—এক ও অদ্বিতীয়।","আল্লাহ অমুখাপেক্ষী, সকলেই তাঁর মুখাপেক্ষী।","তিনি কাউকে জন্ম দেননি এবং তাঁকেও জন্ম দেওয়া হয়নি।","আর তাঁর সমকক্ষ কেউ নেই।"]},{"n":113,"title":"সুরা আল-ফালাক","ayat":5,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nকুল আউযু বিরাব্বিল ফালাক।\nমিন শাররি মা খালাক।\nওয়া মিন শাররি গাসিকিন ইযা ওয়াকাব।\nওয়া মিন শাররিন নাফ্ফাছাতি ফিল উকাদ।\nওয়া মিন শাররি হাসিদিন ইযা হাসাদ।","arabic":["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِنْ شَرِّ مَا خَلَقَ","وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ"],"meaning":["বলুন, আমি আশ্রয় চাই প্রভাতের রবের কাছে,","তিনি যা সৃষ্টি করেছেন, তার অনিষ্ট থেকে,","এবং অন্ধকার রাতের অনিষ্ট থেকে, যখন তা ছড়িয়ে পড়ে,","আর গিরায় ফুঁদানকারীদের অনিষ্ট থেকে,","এবং হিংসুকের অনিষ্ট থেকে, যখন সে হিংসা করে।"]},{"n":114,"title":"সুরা আন-নাস","ayat":6,"pron":"বিসমিল্লাহির রাহমানির রাহীম।\n\nকুল আউযু বিরাব্বিন নাস।\nমালিকিন নাস।\nইলাহিন নাস।\nমিন শাররিল ওয়াসওয়াসিল খান্নাস।\nআল্লাযী ইউওয়াসউইসু ফী সুদূরিন নাস।\nমিনাল জিন্নাতি ওয়ান নাস।","arabic":["قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","إِلَٰهِ النَّاسِ","مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"],"meaning":["বলুন, আমি আশ্রয় চাই মানুষের রবের কাছে,","মানুষের অধিপতির কাছে,","মানুষের উপাস্যের কাছে,","সেই আত্মগোপনকারী কুমন্ত্রণাদাতার অনিষ্ট থেকে,","যে মানুষের অন্তরে কুমন্ত্রণা দেয়,","জিন ও মানুষের মধ্য থেকে।"]}]</script><script>
const ALL=JSON.parse(document.getElementById('surah-data').textContent);
const byNo=new Map(ALL.map(x=>[x.n,x]));
const params=new URLSearchParams(location.search);
const requestNo=Number(params.get('surah'));
const from=params.get('from')==='all'?'all':'ten';
const current=byNo.get(requestNo);
let mode='bn';
let large=false;try{large=localStorage.getItem('dhikr_dubai_reading_size_v3')==='large'}catch(e){}
const back='./?view=quran&collection='+from;
const $=id=>document.getElementById(id);
const bn=n=>String(n).replace(/[0-9]/g,x=>'০১২৩৪৫৬৭৮৯'[Number(x)]);
const escapeText=str=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('back').href=back;
$('backFoot').href=back;
const heading=$('heading'),info=$('info'),body=$('readerBody'),modes=$('modes'),footer=$('footer');
if(!current){
  heading.textContent='সুরা '+(Number.isInteger(requestNo)?bn(requestNo):'');
  info.textContent='পাঠ উপলব্ধ নয়';
  body.innerHTML='<div class="pending"><h1>এই সুরার পাঠ এখনো প্রস্তুত নয়</h1><p>এখন ১০টি ছোট সুরা বাংলা উচ্চারণ, আরবি ও অর্থসহ পড়া যাবে। যাচাই ছাড়া অন্য সুরার পূর্ণ পাঠ দেখানো হচ্ছে না।</p><a href="./?view=quran&collection=ten">সহজ ১০টি সুরা দেখুন →</a></div>';
  modes.hidden=true;footer.hidden=true;$('size').hidden=true;
}else{
  const index=ALL.findIndex(x=>x.n===current.n);
  heading.textContent=current.title;info.textContent='সুরা '+bn(current.n)+' · '+bn(current.ayat)+' আয়াত';
  const previous=ALL[index-1],next=ALL[index+1];
  $('prev').href=previous?'./reader.html?surah='+previous.n+'&from='+from:back;
  $('next').href=next?'./reader.html?surah='+next.n+'&from='+from:back;
  $('next').textContent=next?'পরের সূরা →':'তালিকায় ফিরুন →';$('position').textContent=bn(index+1)+' / '+bn(ALL.length);
  function draw(){
    body.classList.toggle('large',large);body.classList.toggle('arabic',mode==='ar');
    for(const button of modes.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
    let verses=mode==='ar'?current.arabic:mode==='meaning'?current.meaning:current.pron.split(/\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('বিসমিল্লাহির'));
    const basmala=mode==='ar'?'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ':mode==='meaning'?'পরম করুণাময়, অসীম দয়ালু আল্লাহর নামে।':'বিসমিল্লাহির রাহমানির রাহীম।';
    body.innerHTML='<article class="verses"><p class="basmala">'+escapeText(basmala)+'</p>'+verses.map((v,i)=>'<div class="verse"><span class="number">'+bn(i+1)+'</span><span class="words">'+escapeText(v)+'</span></div>').join('')+'<p class="endnote">সুরার সমস্ত '+bn(current.ayat)+'টি আয়াত</p></article>';
  }
  modes.addEventListener('click',e=>{const item=e.target.closest('button[data-mode]');if(!item)return;const sc=$('scroll'),ratio=sc.scrollHeight>sc.clientHeight?sc.scrollTop/(sc.scrollHeight-sc.clientHeight):0;mode=item.dataset.mode;draw();sc.scrollTop=ratio*Math.max(0,sc.scrollHeight-sc.clientHeight)});
  $('size').addEventListener('click',()=>{large=!large;try{localStorage.setItem('dhikr_dubai_reading_size_v3',large?'large':'normal')}catch(e){}draw()});
  function pageScroll(dir){const sc=$('scroll'),first=sc.querySelector('.words');const height=first?parseFloat(getComputedStyle(first).lineHeight):34;sc.scrollBy({top:dir*Math.max(95,sc.clientHeight-height*1.8),behavior:'smooth'})}
  $('down').addEventListener('click',()=>pageScroll(1));$('up').addEventListener('click',()=>pageScroll(-1));
  function saveReading(){try{const key='dhikr_dubai_quran_v5',data=JSON.parse(localStorage.getItem(key)||'{}');const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const set=new Set(data[day]||[]);set.add(String(current.n));data[day]=[...set];localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
  $('next').addEventListener('click',saveReading);
  draw();
}
</script>
<script>
/* Supplementary Quran reader: source-fetched Arabic and Bengali meaning.
   Unverified Bengali-script pronunciation is deliberately not fabricated. */
(function(){
const extra=[78,79,80,81,82,83,84,85,93,94,95,96,97,98,99,100,101,102,104,111];
const no=Number(new URLSearchParams(location.search).get('surah'));
if(!extra.includes(no))return;
const names={78:'আন-নাবা',79:'আন-নাযিআত',80:'আবাসা',81:'আত-তাকভীর',82:'আল-ইনফিতার',83:'আল-মুতাফফিফীন',84:'আল-ইনশিকাক',85:'আল-বুরূজ',93:'আদ-দুহা',94:'আশ-শারহ',95:'আত-তীন',96:'আল-আলাক',97:'আল-কদর',98:'আল-বাইয়্যিনাহ',99:'আয-যিলযাল',100:'আল-আদিয়াত',101:'আল-কারিআহ',102:'আত-তাকাসুর',104:'আল-হুমাযাহ',111:'আল-মাসাদ'};
const target=document.getElementById('readerBody'),heading=document.getElementById('heading'),info=document.getElementById('info'),modes=document.getElementById('modes'),footer=document.getElementById('footer');
heading.textContent='সুরা '+names[no];info.textContent='সূরা '+no+' · আরবি ও বাংলা অর্থ';
const $=id=>document.getElementById(id);
const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
target.innerHTML='<div class="pending"><p>সুরার আরবি ও বাংলা অর্থ লোড হচ্ছে…</p></div>';
modes.hidden=false;footer.hidden=false;$('size').hidden=false;
modes.innerHTML='<span class="primary">সুরা পাঠ</span><button data-mode="bn">উচ্চারণ</button><button data-mode="ar">আরবি</button><button data-mode="meaning">অর্থ</button>';
let rows=[],mode='ar';let enlarged=false;try{enlarged=localStorage.getItem('dhikr_dubai_reading_size_v3')==='large'}catch(e){}
function draw(){
target.classList.toggle('arabic',mode==='ar');
target.classList.toggle('large',enlarged);
for(const button of modes.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
if(mode==='bn'){target.innerHTML='<div class="pending"><h1>বাংলা উচ্চারণ যাচাই চলছে</h1><p>ভুল উচ্চারণ এড়াতে এই সুরার বাংলা উচ্চারণ এখনো প্রকাশ করা হয়নি। আরবি ও বাংলা অর্থ পড়তে পারবেন।</p></div>';return;}
const basmala=mode==='ar'?'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ':'পরম করুণাময়, অসীম দয়ালু আল্লাহর নামে।';
target.innerHTML='<article class="verses"><p class="basmala">'+escape(basmala)+'</p>'+rows.map((r,i)=>'<div class="verse"><span class="number">'+String(i+1).replace(/[0-9]/g,x=>'০১২৩৪৫৬৭৮৯'[Number(x)])+'</span><span class="words">'+escape(r[mode])+'</span></div>').join('')+'<p class="endnote">সুরার সমস্ত '+rows.length+'টি আয়াত</p></article>';
}
modes.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;draw()});
$('size').addEventListener('click',()=>{enlarged=!enlarged;try{localStorage.setItem('dhikr_dubai_reading_size_v3',enlarged?'large':'normal')}catch(e){}draw()});
for(const [id,dir] of [['up',-1],['down',1]])$(id).addEventListener('click',()=>{$('scroll').scrollBy({top:dir*Math.max(95,$('scroll').clientHeight-70),behavior:'smooth'})});
const sorted=[78,79,80,81,82,83,84,85,93,94,95,96,97,98,99,100,101,102,103,104,105,106,107,108,109,110,111,112,113,114],idx=sorted.indexOf(no);
$('prev').href='./reader.html?surah='+(sorted[idx-1]||sorted[sorted.length-1])+'&from=all';
$('next').href='./reader.html?surah='+(sorted[idx+1]||sorted[0])+'&from=all';
$('position').textContent=String(idx+1).replace(/[0-9]/g,x=>'০১২৩৪৫৬৭৮৯'[Number(x)])+' / ৩০';
Promise.all(['quran-uthmani','bn.bengali'].map(edition=>fetch('https://api.alquran.cloud/v1/surah/'+no+'/'+edition).then(r=>{if(!r.ok)throw Error('API');return r.json()}))).then(([ar,bn])=>{
const a=ar.data?.ayahs,b=bn.data?.ayahs;
if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)throw Error('mismatch');
rows=a.map((v,i)=>({ar:v.text,meaning:b[i].text}));
info.textContent='সূরা '+no+' · '+rows.length+' আয়াত';draw();
}).catch(()=>{target.innerHTML='<div class="pending"><p>এখন সুরার পাঠ লোড করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</p><a href="https://quran.com/bn/'+no+'" target="_blank" rel="noopener">Quran.com-এ পড়ুন →</a></div>'});
})();
</script>
</body></html>
