name: Verify daily zikr assets
on:
  pull_request:
    paths:
      - 'daily-zikr.js'
      - 'daily-zikr.css'
      - 'experience.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/daily-zikr-check.yml'
  push:
    branches: [main]
    paths:
      - 'daily-zikr.js'
      - 'daily-zikr.css'
      - 'experience.js'
      - 'index.html'
      - 'sw.js'
jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check daily-zikr.js
          node --check experience.js
          node --check sw.js
      - name: Check links and cache
        run: |
          grep -q 'src="daily-zikr.js?v=1.0.1"' index.html
          grep -q 'href="daily-zikr.css?v=1.0.1"' index.html
          grep -q "'./daily-zikr.js'" sw.js
          grep -q "'./daily-zikr.css'" sw.js
          grep -q 'dhikr_dubai_daily21_v1' daily-zikr.js
      - name: Check compact reader regression
        run: |
          grep -q 'renderKeepReadingPosition' daily-zikr.js
          grep -q 'd21-reader-context' daily-zikr.js
          grep -q 'overflow-y:auto' daily-zikr.css
          grep -q 'white-space:nowrap' daily-zikr.css
          grep -q 'dubai-dhikr-v10.7.1' sw.js
