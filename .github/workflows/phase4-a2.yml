name: Phase 4 A2 — Counter Save Reliability
on:
  pull_request:
    paths:
      - 'app.js'
      - 'tahajjud.js'
      - 'experience.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/phase4-counter.mjs'
      - 'tests/phase4-counter.spec.mjs'
      - 'tests/phase4-stability.mjs'
      - '.github/workflows/phase4-a2.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tahajjud.js'
      - 'experience.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/phase4-counter.mjs'
      - 'tests/phase4-counter.spec.mjs'
jobs:
  source-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all phase regression tests
        run: node --test tests/phase1-core.mjs tests/phase2-experience.mjs tests/phase3-polish.mjs tests/phase4-stability.mjs tests/phase4-counter.mjs
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dhikr-a2-server.log 2>&1 &
          sleep 2
      - name: Test mobile counters and existing journeys
        run: npx playwright test tests/phase3-mobile.spec.mjs tests/phase4-stability.spec.mjs tests/phase4-counter.spec.mjs --reporter=line
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-a2-mobile-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
