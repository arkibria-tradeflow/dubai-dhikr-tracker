name: Unified Quran Verse Reader
on:
  pull_request:
    paths:
      - 'reader.html'
      - 'reader-phase1.js'
      - 'quran-unified-reader.js'
      - 'quran-unified-reader.css'
      - 'sw.js'
      - 'tests/quran-unified-reader.mjs'
      - 'tests/quran-unified-reader.spec.mjs'
      - 'tests/smart-header.mjs'
      - '.github/workflows/quran-unified-reader.yml'
  push:
    branches: [main]
    paths:
      - 'reader.html'
      - 'reader-phase1.js'
      - 'quran-unified-reader.js'
      - 'quran-unified-reader.css'
      - 'sw.js'
      - 'tests/quran-unified-reader.mjs'
      - 'tests/quran-unified-reader.spec.mjs'
jobs:
  regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Quran and existing source regression checks
        run: node --test tests/phase1-core.mjs tests/phase2-experience.mjs tests/phase3-polish.mjs tests/phase4-stability.mjs tests/phase4-counter.mjs tests/phase4-backup.mjs tests/quran-compact.mjs tests/dua-compact.mjs tests/smart-header.mjs tests/quran-unified-reader.mjs
  mobile-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dhikr-unified-reader.log 2>&1 &
          sleep 2
      - name: Verify verse-by-verse reader and existing mobile paths
        run: npx playwright test tests/quran-unified-reader.spec.mjs tests/phase3-mobile.spec.mjs tests/quran-compact.spec.mjs --reporter=line
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quran-unified-reader-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
