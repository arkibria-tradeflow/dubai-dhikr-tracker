name: Phase 3 UX and offline QA
on:
  pull_request:
    paths:
      - 'phase3-polish.css'
      - 'phase3-polish.js'
      - 'reader.html'
      - 'sw.js'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'tests/phase3-polish.mjs'
      - 'tests/phase3-mobile.spec.mjs'
      - '.github/workflows/phase3-polish.yml'
  push:
    branches: [main]
    paths:
      - 'phase3-polish.css'
      - 'phase3-polish.js'
      - 'reader.html'
      - 'sw.js'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'tests/phase3-polish.mjs'
      - 'tests/phase3-mobile.spec.mjs'
jobs:
  source-and-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests from all three phases
        run: node --test tests/phase1-core.mjs tests/phase2-experience.mjs tests/phase3-polish.mjs
  mobile-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local PWA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dhikr-phase3-server.log 2>&1 &
          sleep 2
      - name: Run mobile viewport smoke tests
        run: npx playwright test tests/phase3-mobile.spec.mjs --reporter=line
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-mobile-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
