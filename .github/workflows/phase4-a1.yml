name: Phase 4 A1 — Stable Screen Updates
on:
  pull_request:
    paths:
      - 'app.js'
      - 'location-prayers.js'
      - 'phase4-stability.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/phase3-polish.mjs'
      - 'tests/phase4-stability.mjs'
      - 'tests/phase4-stability.spec.mjs'
      - '.github/workflows/phase4-a1.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'location-prayers.js'
      - 'phase4-stability.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/phase4-stability.mjs'
      - 'tests/phase4-stability.spec.mjs'
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all source and offline tests
        run: node --test tests/phase1-core.mjs tests/phase2-experience.mjs tests/phase3-polish.mjs tests/phase4-stability.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dhikr-phase4-server.log 2>&1 &
          sleep 2
      - name: Run mobile stability test
        run: npx playwright test tests/phase3-mobile.spec.mjs tests/phase4-stability.spec.mjs --reporter=line
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-a1-browser-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
