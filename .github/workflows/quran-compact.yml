name: Compact Quran Library UI
on:
  pull_request:
    paths:
      - 'v9-native-links.js'
      - 'quran-compact.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/quran-compact.mjs'
      - 'tests/quran-compact.spec.mjs'
      - 'tests/phase4-backup.mjs'
      - 'tests/phase4-stability.mjs'
      - '.github/workflows/quran-compact.yml'
  push:
    branches: [main]
    paths:
      - 'v9-native-links.js'
      - 'quran-compact.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/quran-compact.mjs'
      - 'tests/quran-compact.spec.mjs'
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run compact Quran and previous regression tests
        run: node --test tests/phase1-core.mjs tests/phase2-experience.mjs tests/phase3-polish.mjs tests/phase4-stability.mjs tests/phase4-counter.mjs tests/phase4-backup.mjs tests/quran-compact.mjs
  chromium-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dhikr-quran-compact.log 2>&1 &
          sleep 2
      - name: Test compact Quran UI and existing mobile journeys
        run: npx playwright test tests/quran-compact.spec.mjs tests/phase3-mobile.spec.mjs --reporter=line
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quran-compact-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
