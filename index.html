/* ---- v2 / immersive iPhone design system ---- */
:root{--v2-ink:#173a32;--v2-green:#075a46;--v2-forest:#073b31;--v2-mint:#e8f2e9;--v2-sand:#f3e3c8;--v2-gold:#d8b777;--v2-paper:#f6f6f0}
html,body{background:#f5f6f0;color:var(--v2-ink)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #d9ae5d;outline-offset:3px}
.shell{max-width:580px;padding:0 19px 120px}
.nav{padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#f5f6f0 64%,#f5f6f000)}
.nav-in{max-width:560px;border-radius:23px;box-shadow:0 16px 30px rgba(6,49,36,.13);border:1px solid #e9ebe4}
.nav-btn{min-height:58px;min-width:86px;font-size:11px;font-weight:650}
.nav-btn.active{background:#e5f0e7;color:#075b46}
.v2-topbar{display:flex;justify-content:space-between;align-items:center;min-height:89px;padding-top:env(safe-area-inset-top);gap:16px}
.v2-logo{display:flex;gap:11px;align-items:center;min-width:0}
.v2-symbol{height:48px;width:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;color:#e7c788;font-size:27px;background:linear-gradient(125deg,#086950,#05382d);box-shadow:0 8px 15px #07392b22}
.v2-logo strong{font-size:25px;line-height:1.1;display:block;letter-spacing:-.5px}
.v2-logo small{display:block;color:#8a988b;font-size:8.5px;letter-spacing:1.1px;white-space:nowrap;margin-top:4px}
.v2-location{border:1px solid #e0e9df;color:#3a705b;background:#fff;border-radius:100px;padding:11px 12px;font-size:10px;font-weight:850;white-space:nowrap;letter-spacing:.4px}
.v2-hero{isolation:isolate;overflow:hidden;position:relative;background:linear-gradient(150deg,#0a614c 1%,#073b31 65%,#092b26);border-radius:29px;min-height:265px;box-shadow:0 24px 34px #07533c29;color:#fff}
.v2-hero:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 100% 0,#a2cba344,transparent 37%),linear-gradient(120deg,transparent,#00000008)}
.v2-hero-halo{pointer-events:none;position:absolute;right:-72px;top:17px;width:245px;height:245px;border-radius:50%;border:1px solid #e0cca51c;box-shadow:0 0 0 35px #c9b58309,0 0 0 75px #c9b58308}
.v2-hero-orbit{position:absolute;right:10px;top:12px;font-size:102px;color:#e9d0a02b;line-height:1}
.v2-hero-inner{padding:29px 26px 25px;position:relative;z-index:1}
.v2-hero-overline{font-size:11px;color:#d8e9dc;opacity:.9}
.v2-hero h1{font-size:clamp(26px,7vw,34px);line-height:1.52;letter-spacing:-.7px;margin:12px 0 7px;max-width:400px;font-weight:800}
.v2-hero h1 em{font-style:normal;color:#efd29e}
.v2-hero p{max-width:275px;font-size:12px;line-height:1.85;color:#cfe2d6;margin:0}
.v2-hero-rule{height:1px;background:#ffffff32;margin:25px 0 15px}
.v2-hero-data{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.v2-hero-data div:last-child{text-align:right}
.v2-hero-data small{display:block;color:#b9d0c2;font-size:10px;margin-bottom:6px}
.v2-hero-data strong{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.v2-hero-data strong.v2-next{font-size:12px;line-height:1.5}
.v2-progress-card{display:flex;align-items:center;gap:21px;background:#fff;border:1px solid #eceee7;padding:19px 20px;border-radius:24px;margin-top:17px;box-shadow:0 8px 25px #142f2609}
.v2-progress-ring{--p:0%;width:96px;height:96px;flex:0 0 96px;display:grid;place-items:center;background:conic-gradient(#0c795c var(--p),#e6efe7 0);border-radius:50%;position:relative}
.v2-progress-ring:before{content:'';position:absolute;inset:9px;background:#fff;border-radius:50%}
.v2-progress-ring>div{position:relative;text-align:center;line-height:1.08}
.v2-progress-ring strong{font-size:30px;color:#075f4a;font-weight:850}
.v2-progress-ring span{font-size:12px;color:#9ca99c;display:block}
.v2-progress-content{display:flex;flex-direction:column;gap:5px;min-width:0}
.v2-kicker{font-size:10px;color:#2b8c68;font-weight:800}
.v2-progress-content strong{font-size:17px;line-height:1.55;letter-spacing:-.25px}
.v2-progress-content small{font-size:11px;color:#809084;line-height:1.6}
.v2-continue{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;background:linear-gradient(120deg,#0d7959,#086449);color:#fff;border:0;border-radius:20px;min-height:86px;width:100%;padding:17px 19px;margin-top:16px;box-shadow:0 13px 23px #0462462b}
.v2-continue:active,.v2-giant-tap:active{transform:scale(.98)}
.v2-continue-left{display:flex;flex-direction:column;gap:5px}
.v2-continue-left small{font-size:11px;color:#d8eae0}
.v2-continue-left strong{font-size:19px}
.v2-circle-arrow{display:grid;place-items:center;border-radius:50%;width:47px;height:47px;flex:0 0 47px;color:#0e6b50;background:#f9e6bf;font-size:25px;font-weight:600}
.v2-section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:30px 2px 15px}
.v2-section-heading small{display:block;letter-spacing:1.8px;font-size:9px;color:#ad8b59;font-weight:900;margin-bottom:4px}
.v2-section-heading h2{font-size:23px;letter-spacing:-.5px;margin:0}
.v2-section-heading>span{font-size:11px;color:#869586;padding-bottom:3px}
.v2-prayer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.v2-prayer{width:100%;min-height:149px;border-radius:22px;background:white;border:1px solid #e9ede6;padding:17px;text-align:left;display:flex;flex-direction:column;align-items:stretch;position:relative;box-shadow:0 4px 15px #143f2b08;transition:transform .16s}
.v2-prayer:not(:disabled):active{transform:scale(.975)}
.v2-prayer.is-current{border:1.5px solid #7ac6a2;background:linear-gradient(145deg,#edf9ee,#fff)}
.v2-prayer.v2-locked{background:#f0f1ec;box-shadow:none;color:#87918a}
.v2-prayer-emblem{width:43px;height:43px;display:grid;place-items:center;background:#e4f2e8;border-radius:15px;color:#167052;font-size:22px}
.v2-locked .v2-prayer-emblem{color:#9aa59e;background:#e5e9e2}
.v2-prayer-details{display:flex;flex-direction:column;margin-top:14px;gap:3px}
.v2-prayer-details strong{font-size:18px;line-height:1.1}
.v2-prayer-details small{font-size:12px;color:#8d9b8e;font-variant-numeric:tabular-nums}
.v2-status{position:absolute;top:18px;right:14px;font-weight:800;font-size:10px;color:#237658;background:#e6f3e8;border-radius:15px;padding:5px 8px}
.v2-locked .v2-status{background:#e4e9e1;color:#8d9990}
.v2-status.is-complete{background:#d1f4e0}
.v2-home-note{font-size:11px;line-height:1.8;text-align:center;color:#7e8d80;margin:20px 7px 4px}
.v2-home-note small{font-size:10px}
.v2-simple-header{display:flex;align-items:center;justify-content:space-between;height:79px;gap:12px;font-size:14px;font-weight:700}
.v2-back,.v2-focus-close,.v2-focus-min{width:45px;height:45px;flex:0 0 45px;border:1px solid #e4eae2;border-radius:15px;background:#fff;color:#235a44;display:grid;place-items:center}
.v2-header-moon{font-size:24px;color:#96743c;width:45px;text-align:center}
.v2-session-hero{padding:25px 24px 27px;border-radius:26px;background:radial-gradient(circle at 100% 0,#3f846b,#0b5c47 55%,#073d31);color:#fff;box-shadow:0 15px 28px #135a4022}
.v2-session-icon{font-size:30px;color:#ebd09b;margin-bottom:13px}
.v2-session-hero>small{display:block;font-size:11px;color:#bedcc8;line-height:1.6}
.v2-session-hero h1{font-size:27px;line-height:1.4;margin:6px 0}
.v2-session-hero p{font-size:12px;color:#d2e7da;margin:0}
.v2-meter{height:8px;background:#ffffff31;border-radius:20px;margin-top:23px;overflow:hidden}
.v2-meter span{display:block;height:100%;background:#f2d299;border-radius:20px}
.v2-done-banner{padding:17px 18px;background:#dff2e6;color:#08764f;margin-top:17px;border-radius:16px;font-size:14px;font-weight:700}
.v2-continue.session-start{margin-top:17px}
.v2-step-list{display:flex;flex-direction:column;gap:11px}
.v2-dua-row{width:100%;background:#fff;border:1px solid #e6ece5;min-height:92px;border-radius:19px;display:flex;align-items:center;gap:13px;padding:16px;text-align:left;box-shadow:0 4px 15px #14482c08}
.v2-dua-row:active{background:#f2faf2}
.v2-stepnum{display:grid;place-items:center;background:#ebf2ed;color:#166c50;width:48px;height:48px;flex:0 0 48px;border-radius:15px;font-size:16px;font-weight:900}
.v2-dua-row.complete .v2-stepnum{background:#dff5e6}
.v2-row-copy{flex:1;min-width:0}
.v2-row-copy strong{display:block;font-size:16px;line-height:1.5;color:#17382d}
.v2-row-copy small{display:block;color:#7f8f82;font-size:11px;margin-top:4px;line-height:1.4}
.v2-row-arrow{font-size:21px;color:#8cb89d}
/* The reading session is a truly separate viewport, not a tiny inline accordion. */
body.focus-mode{overflow:hidden;overscroll-behavior:none}
body.focus-mode .nav{display:none}
body.focus-mode .shell{padding:0}
.v2-focus-page{position:fixed;left:50%;top:0;bottom:0;transform:translateX(-50%);width:100%;max-width:620px;z-index:25;background:#f8f8f4;display:grid;grid-template-rows:auto 4px minmax(0,1fr) auto;box-shadow:0 0 50px #091f161c}
.v2-focus-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 20px 15px;background:#fff}
.v2-focus-close{font-size:21px;font-weight:450}
.v2-focus-min{background:#eaf4eb;transform:none}
.v2-focus-min svg{transform:rotate(180deg)}
.v2-focus-heading{text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0}
.v2-focus-heading span{font-size:15px;font-weight:850}
.v2-focus-heading strong{font-size:11px;color:#809288}
.v2-focus-line{height:4px;width:100%;background:#e4eee6;overflow:hidden}
.v2-focus-line span{display:block;height:100%;background:#0c8c65;transition:width .28s}
.v2-focus-reading{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#c7d8c9 transparent}
.v2-focus-body{padding:24px 20px 32px;max-width:560px;margin:0 auto}
.v2-focus-kicker{text-transform:uppercase;letter-spacing:1.6px;color:#b79a61;font-size:10px;font-weight:850}
.v2-focus-body h1{font-size:clamp(23px,6.7vw,32px);letter-spacing:-.5px;line-height:1.5;margin:11px 0 6px}
.v2-focus-subtitle{color:#8c9b8e;font-size:13px;margin-bottom:22px}
.v2-bullet{margin:0 8px}
.v2-focus-tabs{display:flex;gap:5px;align-items:stretch;padding:5px;background:#eaeee8;border-radius:15px;margin-bottom:17px}
.v2-tab{display:block;flex:1;min-width:0;border:0;border-radius:12px;background:transparent;color:#79867c;padding:13px 5px;font-size:12px;font-weight:850;white-space:nowrap}
.v2-tab.active{background:#fff;color:#0b6950;box-shadow:0 3px 8px #1139280f}
.v2-reading-paper{border:1px solid #ecece2;border-radius:22px;padding:23px 22px 26px;min-height:173px;background:linear-gradient(145deg,#fff,#fffdf7);box-shadow:0 9px 32px #4d593409}
.v2-reading-caption{font-size:11px;font-weight:850;color:#ab8d5b;letter-spacing:.5px;margin-bottom:15px}
.v2-reading-p{font-size:20px;font-weight:600;line-height:2;letter-spacing:0;overflow-wrap:break-word;word-break:normal;margin:0 0 14px;color:#1b4134}
.v2-reading-p:last-child{margin-bottom:0}
.v2-reading-paper.is-long .v2-reading-p{font-size:18px;line-height:2.02}
.v2-reading-paper.is-arabic .v2-reading-p{font-family:'Geeza Pro','Noto Naskh Arabic',serif;font-weight:500;font-size:29px;line-height:2.15;direction:rtl;text-align:right}
.v2-reading-paper.is-arabic.is-long .v2-reading-p{font-size:25px;line-height:2.15}
.v2-reading-paper:lang(bn) .v2-reading-p{white-space:normal}
.v2-reading-hint{margin-top:18px;color:#819184;font-size:11px;line-height:1.9;text-align:center}
.v2-focus-dock{padding:15px 20px calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -8px 35px #1b402313;border-top:1px solid #e9ede6;z-index:1}
.v2-counter-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.v2-counter-top>div:first-child{display:flex;align-items:baseline;gap:12px}
.v2-counter-top small{color:#839489;font-size:12px;font-weight:700}
.v2-counter-top strong{font-size:28px;color:#0a654b;line-height:1.1;font-variant-numeric:tabular-nums}
.v2-counter-top strong span{font-size:15px;color:#9baba0}
.v2-counter-progress{font-size:12px;font-weight:900;background:#e5f4e8;color:#11704f;border-radius:20px;padding:8px 11px}
.v2-tap-row{display:flex;gap:11px;align-items:stretch}
.v2-minus{width:59px;min-width:59px;border:1px solid #dbe9df;border-radius:17px;font-size:34px;background:#f2f6f1;color:#41745a}
.v2-minus:disabled{opacity:.35}
.v2-giant-tap{position:relative;flex:1;min-height:76px;border:0;border-radius:19px;background:linear-gradient(135deg,#0c9067,#036445);box-shadow:0 9px 19px #04674937;color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;transition:transform .12s ease}
.v2-giant-tap:disabled{background:#e1f0e6;color:#4c8667;box-shadow:none;opacity:1}
.v2-button-flower{font-size:22px;color:#f5d69d}
.v2-tap-arrow{font-size:25px}
.v2-next-link{display:block;width:100%;text-align:center;border:0;background:transparent;color:#267257;font-weight:750;font-size:12px;padding:12px}
.v2-success-layer{position:absolute;inset:0;z-index:4;background:#0b392e75;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:26px;animation:v2fade .18s ease-out}
.v2-success-card{position:relative;max-width:420px;width:100%;background:#fff;border-radius:30px;text-align:center;padding:32px 26px 27px;box-shadow:0 25px 80px #042a2745;animation:v2rise .25s ease-out}
.v2-success-seal{background:linear-gradient(150deg,#0fa06a,#096042);width:91px;height:91px;display:grid;place-items:center;border-radius:50%;color:#fff;font-size:51px;font-weight:350;margin:0 auto 23px;box-shadow:0 0 0 10px #e7f6ea}
.v2-success-over{font-size:10px;letter-spacing:2px;color:#ac8752;font-weight:900}
.v2-success-card h2{font-size:29px;margin:12px 0}
.v2-success-card p{font-size:14px;color:#6e8673;line-height:1.75;margin:0}
.v2-success-track{height:5px;border-radius:10px;background:#eef4ee;overflow:hidden;margin:24px 0 17px}
.v2-success-track span{display:block;height:100%;background:#0b8059;animation:v2fill 1.25s linear forwards}
.v2-success-next{border:0;background:#eaf5ed;color:#0d7453;border-radius:15px;padding:15px;font-size:15px;font-weight:800;width:100%;min-height:53px}
@keyframes v2fade{from{opacity:0}to{opacity:1}}@keyframes v2rise{from{transform:translateY(20px) scale(.96)}to{transform:translateY(0) scale(1)}}@keyframes v2fill{from{width:0}to{width:100%}}
@media(max-width:360px){.v2-hero-inner{padding:23px 19px}.v2-progress-card{gap:14px;padding:15px}.v2-prayer{padding:13px}.v2-tab{font-size:11px}.v2-reading-p{font-size:18px}.v2-focus-body{padding:20px 14px 26px}.v2-focus-dock{padding-left:13px;padding-right:13px}.v2-giant-tap{font-size:14px}.v2-reading-paper{padding:20px 15px}}
@media(min-width:800px){.v2-hero{min-height:300px}.v2-prayer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.v2-focus-page{top:20px;bottom:20px;border-radius:27px;overflow:hidden}.v2-focus-head{padding-top:14px}}
@media(prefers-reduced-motion:reduce){.v2-success-layer,.v2-success-card,.v2-success-track span{animation:none!important}.v2-continue,.v2-giant-tap{transition:none}}

</style>
</head>
<body>
<div class="app"><main class="shell" id="root" aria-live="polite"></main></div>
<nav class="nav" aria-label="নেভিগেশন"><div class="nav-in" id="nav"></div></nav>
<div class="toast" role="status" id="toast"></div>
<input class="hide" type="file" accept="application/json,.json" id="restore-input">
<script src="app.js" defer></script>
</body>
