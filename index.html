/* ---- v2 / immersive iPhone design system ---- */
:root{--v2-ink:#173a32;--v2-green:#075a46;--v2-forest:#073b31;--v2-mint:#e8f2e9;--v2-sand:#f3e3c8;--v2-gold:#d8b777;--v2-paper:#f6f6f0}
html,body{background:#f5f6f0;color:var(--v2-ink)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #d9ae5d;outline-offset:3px}
.shell{max-width:580px;padding:0 19px 120px}
.nav{padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#f5f6f0 64%,#f5f6f000)}
.nav-in{max-width:560px;border-radius:23px;box-shadow:0 16px 30px rgba(6,49,36,.13);border:1px solid #e9ebe4}
.nav-btn{min-height:58px;min-width:86px;font-size:11px;font-weight:650}
.nav-btn.active{background:#e5f0e7;color:#075b46}
.v2-topbar{display:flex;justify-content:space-between;align-items:center;min-height:89px;padding-top:env(safe-area-inset-top);gap:16px}
.v2-logo{display:flex;gap:11px;align-items:center;min-width:0}
.v2-symbol{height:48px;width:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;color:#e7c788;font-size:27px;background:linear-gradient(125deg,#086950,#05382d);box-shadow:0 8px 15px #07392b22}
.v2-logo strong{font-size:25px;line-height:1.1;display:block;letter-spacing:-.5px}
.v2-logo small{display:block;color:#8a988b;font-size:8.5px;letter-spacing:1.1px;white-space:nowrap;margin-top:4px}
.v2-location{border:1px solid #e0e9df;color:#3a705b;background:#fff;border-radius:100px;padding:11px 12px;font-size:10px;font-weight:850;white-space:nowrap;letter-spacing:.4px}
.v2-hero{isolation:isolate;overflow:hidden;position:relative;background:linear-gradient(150deg,#0a614c 1%,#073b31 65%,#092b26);border-radius:29px;min-height:265px;box-shadow:0 24px 34px #07533c29;color:#fff}
.v2-hero:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 100% 0,#a2cba344,transparent 37%),linear-gradient(120deg,transparent,#00000008)}
.v2-hero-halo{pointer-events:none;position:absolute;right:-72px;top:17px;width:245px;height:245px;border-radius:50%;border:1px solid #e0cca51c;box-shadow:0 0 0 35px #c9b58309,0 0 0 75px #c9b58308}
.v2-hero-orbit{position:absolute;right:10px;top:12px;font-size:102px;color:#e9d0a02b;line-height:1}
.v2-hero-inner{padding:29px 26px 25px;position:relative;z-index:1}
.v2-hero-overline{font-size:11px;color:#d8e9dc;opacity:.9}
.v2-hero h1{font-size:clamp(26px,7vw,34px);line-height:1.52;letter-spacing:-.7px;margin:12px 0 7px;max-width:400px;font-weight:800}
.v2-hero h1 em{font-style:normal;color:#efd29e}
.v2-hero p{max-width:275px;font-size:12px;line-height:1.85;color:#cfe2d6;margin:0}
.v2-hero-rule{height:1px;background:#ffffff32;margin:25px 0 15px}
.v2-hero-data{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.v2-hero-data div:last-child{text-align:right}
.v2-hero-data small{display:block;color:#b9d0c2;font-size:10px;margin-bottom:6px}
.v2-hero-data strong{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.v2-hero-data strong.v2-next{font-size:12px;line-height:1.5}
.v2-progress-card{display:flex;align-items:center;gap:21px;background:#fff;border:1px solid #eceee7;padding:19px 20px;border-radius:24px;margin-top:17px;box-shadow:0 8px 25px #142f2609}
.v2-progress-ring{--p:0%;width:96px;height:96px;flex:0 0 96px;display:grid;place-items:center;background:conic-gradient(#0c795c var(--p),#e6efe7 0);border-radius:50%;position:relative}
.v2-progress-ring:before{content:'';position:absolute;inset:9px;background:#fff;border-radius:50%}
.v2-progress-ring>div{position:relative;text-align:center;line-height:1.08}
.v2-progress-ring strong{font-size:30px;color:#075f4a;font-weight:850}
.v2-progress-ring span{font-size:12px;color:#9ca99c;display:block}
.v2-progress-content{display:flex;flex-direction:column;gap:5px;min-width:0}
.v2-kicker{font-size:10px;color:#2b8c68;font-weight:800}
.v2-progress-content strong{font-size:17px;line-height:1.55;letter-spacing:-.25px}
.v2-progress-content small{font-size:11px;color:#809084;line-height:1.6}
.v2-continue{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;background:linear-gradient(120deg,#0d7959,#086449);color:#fff;border:0;border-radius:20px;min-height:86px;width:100%;padding:17px 19px;margin-top:16px;box-shadow:0 13px 23px #0462462b}
.v2-continue:active,.v2-giant-tap:active{transform:scale(.98)}
.v2-continue-left{display:flex;flex-direction:column;gap:5px}
.v2-continue-left small{font-size:11px;color:#d8eae0}
.v2-continue-left strong{font-size:19px}
.v2-circle-arrow{display:grid;place-items:center;border-radius:50%;width:47px;height:47px;flex:0 0 47px;color:#0e6b50;background:#f9e6bf;font-size:25px;font-weight:600}
.v2-section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:30px 2px 15px}
.v2-section-heading small{display:block;letter-spacing:1.8px;font-size:9px;color:#ad8b59;font-weight:900;margin-bottom:4px}
.v2-section-heading h2{font-size:23px;letter-spacing:-.5px;margin:0}
.v2-section-heading>span{font-size:11px;color:#869586;padding-bottom:3px}
.v2-prayer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.v2-prayer{width:100%;min-height:149px;border-radius:22px;background:white;border:1px solid #e9ede6;padding:17px;text-align:left;display:flex;flex-direction:column;align-items:stretch;position:relative;box-shadow:0 4px 15px #143f2b08;transition:transform .16s}
.v2-prayer:not(:disabled):active{transform:scale(.975)}
.v2-prayer.is-current{border:1.5px solid #7ac6a2;background:linear-gradient(145deg,#edf9ee,#fff)}
.v2-prayer.v2-locked{background:#f0f1ec;box-shadow:none;color:#87918a}
.v2-prayer-emblem{width:43px;height:43px;display:grid;place-items:center;background:#e4f2e8;border-radius:15px;color:#167052;font-size:22px}
.v2-locked .v2-prayer-emblem{color:#9aa59e;background:#e5e9e2}
.v2-prayer-details{display:flex;flex-direction:column;margin-top:14px;gap:3px}
.v2-prayer-details strong{font-size:18px;line-height:1.1}
.v2-prayer-details small{font-size:12px;color:#8d9b8e;font-variant-numeric:tabular-nums}
.v2-status{position:absolute;top:18px;right:14px;font-weight:800;font-size:10px;color:#237658;background:#e6f3e8;border-radius:15px;padding:5px 8px}
.v2-locked .v2-status{background:#e4e9e1;color:#8d9990}
.v2-status.is-complete{background:#d1f4e0}
.v2-home-note{font-size:11px;line-height:1.8;text-align:center;color:#7e8d80;margin:20px 7px 4px}
.v2-home-note small{font-size:10px}
.v2-simple-header{display:flex;align-items:center;justify-content:space-between;height:79px;gap:12px;font-size:14px;font-weight:700}

  --white:#122229; --danger:#ff8f8c;

  --glow:#1de1a3; --gold-soft:#d0af76;
}

.v2-done-banner{background:#123f34;border:1px solid #358f6f;color:#86f2be;border-radius:18px}
/* Full screen ceremony — not an accordion */
body.focus-mode{background:#061119;overflow:hidden}
body.focus-mode .shell{padding:0}
.v2-focus-page{background:radial-gradient(ellipse 80% 30% at 52% 0,#133b37 0,transparent 95%),#071219;grid-template-rows:auto 3px minmax(0,1fr) auto;box-shadow:0 0 90px #000a;color:#eff9f4}
.v2-focus-head{background:#0b2028e8;border-bottom:1px solid #223d41;padding:calc(env(safe-area-inset-top) + 12px) 18px 15px;min-height:83px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.v2-focus-close{font-size:20px;background:#193036;color:#e7f3ed}
.v2-focus-min{background:#203c39;color:#6defbe}
.v2-focus-heading span{font-size:16px;font-weight:900;color:#f7fff9}
.v2-focus-heading strong{font-size:11px;color:#9dbfb1}
.v2-focus-line{background:#1d383b}
.v2-focus-line span{background:linear-gradient(90deg,#c5a165,#43ecc0);box-shadow:0 0 14px #17c798}
.v2-focus-reading{scrollbar-color:#3d796d transparent;overscroll-behavior:contain}
.v2-focus-body{padding:27px 20px 34px;max-width:580px}
.v2-focus-kicker{font-size:11px;font-weight:900;color:#e9c481;letter-spacing:1.8px}
.v2-focus-body h1{color:#fff;font-size:clamp(27px,7.5vw,38px);line-height:1.45;letter-spacing:-.5px;font-weight:900;margin:16px 0 7px}
.v2-focus-subtitle{color:#a3beba;font-size:13px;margin-bottom:22px}
.v2-focus-tabs{background:#14282f;border:1px solid #2b494d;border-radius:17px;padding:5px;gap:5px;margin-bottom:18px}
.v2-tab{min-height:48px;border-radius:12px;color:#9bb6b8;font-size:12px;font-weight:900;padding:11px 5px}
.v2-tab.active{background:#24644e;color:#ddffef;box-shadow:0 4px 20px #033922aa,inset 0 1px #67e6b243}
.v2-reading-paper{background:linear-gradient(145deg,#142830 0%,#102028 100%);border:1px solid #3b5c5a;border-radius:26px;padding:26px 22px 28px;min-height:210px;box-shadow:0 16px 35px #0005,inset 0 1px #93edb10e;position:relative;overflow:hidden}
.v2-reading-paper:before{content:"";position:absolute;width:125px;height:125px;right:-66px;top:-75px;border-radius:50%;box-shadow:0 0 0 25px #20bd9344,0 0 0 48px #48cc9b12;pointer-events:none}
.v2-reading-caption{color:#e7c68f;font-size:11px;font-weight:900;letter-spacing:.6px;margin-bottom:17px;position:relative}
.v2-reading-p{font-size:clamp(20px,5.1vw,23px);line-height:1.9;letter-spacing:0;color:#f0fbf3;font-weight:620;margin:0 0 18px;position:relative;overflow-wrap:anywhere;text-wrap:pretty}
.v2-reading-paper.is-long .v2-reading-p{font-size:clamp(18px,4.65vw,20px);line-height:1.92;margin-bottom:15px}
.v2-reading-paper.is-arabic .v2-reading-p{font-family:'Geeza Pro','Noto Naskh Arabic',serif;font-weight:500;font-size:clamp(29px,7.5vw,36px);line-height:2;color:#f6e6c8;text-align:right;overflow-wrap:break-word}
.v2-reading-paper.is-arabic.is-long .v2-reading-p{font-size:clamp(24px,6.5vw,29px);line-height:2}
.v2-reading-hint{color:#94b6af;font-size:12px;line-height:1.8;margin-top:23px}
.v2-focus-dock{border-top:1px solid #31514f;background:linear-gradient(180deg,#10242b,#0a1a22);box-shadow:0 -18px 32px #0006;padding:16px 18px calc(14px + env(safe-area-inset-bottom));z-index:2}
.v2-counter-top{margin-bottom:16px}
.v2-counter-top small{font-size:12px;color:#99bdb2}
.v2-counter-top strong{font-size:32px;color:#62f2be}
.v2-counter-top strong span{font-size:18px;color:#94b1b0}
.v2-counter-progress{background:#1c5246;color:#9af6ce;border:1px solid #2c7b61;font-size:13px;border-radius:30px;padding:9px 12px}
.v2-tap-row{gap:12px}
.v2-minus{width:66px;min-width:66px;border:1px solid #37565a;border-radius:21px;background:#22353a;color:#a6c3bd;font-size:36px}
.v2-giant-tap{min-height:93px;border:1px solid #8effd06c;border-radius:22px;background:linear-gradient(105deg,#25e3ac,#13b886);box-shadow:0 10px 28px #12bd8561,inset 0 1px #e5fff0aa;color:#063326;font-size:18px;font-weight:950;gap:8px;padding:13px 12px}
.v2-button-flower{font-size:26px;color:#0d6447}
.v2-tap-arrow{font-size:31px;color:#07533c}
.v2-giant-tap:disabled{background:#245848;color:#87eab8;border:1px solid #47856f;box-shadow:none}
.v2-next-link{color:#71edbc;font-size:13px;font-weight:850;min-height:40px}
/* Ceremony after a completed item */
.v2-success-layer{background:#031515d8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:22px}
.v2-success-card{background:radial-gradient(circle at 50% -3%,#225345 0,#14272e 44%,#0d1e26 100%);border:1px solid #467b63;color:#f0fcf5;border-radius:32px;padding:36px 25px 28px;box-shadow:0 35px 90px #000a,0 0 80px #27c58d19}
.v2-success-seal{width:100px;height:100px;background:linear-gradient(135deg,#5ff1bd,#149671);box-shadow:0 0 0 9px #174f3c,0 0 0 19px #26684c4d,0 0 44px #2adea176;color:#072f23;font-size:55px;margin-bottom:28px}
.v2-success-over{color:#f4d397;font-size:11px;letter-spacing:2.5px}
.v2-success-card h2{font-size:32px;color:#f7fff9;margin:14px 0}
.v2-success-card p{color:#aecbc0;font-size:15px;line-height:1.85}
.v2-success-track{background:#24473d;height:6px;margin:27px 0 19px}
.v2-success-track span{background:#53efbb}
.v2-success-next{background:#244b40;color:#dcfff0;border:1px solid #4b9074;border-radius:17px;min-height:57px;font-size:15px}
/* Supporting pages remain consistent */
.panel-head h1{font-size:27px}
.stat-val{color:#5cefb8}
.record{border:1px solid #2a454a}
.record-right{color:#5be8ad}
.daylabel{color:#a6c1b8}
.week{background:#11252b}
.notice{background:#132c30;border:1px solid #2d5351;border-radius:18px}
.settings-card{background:#13252d;border:1px solid #2d454a}
.settings-card h3{font-size:18px}
.action-btn{background:#1e3b3a;color:#b2f7d5;border-color:#3a6a58}
.action-btn.danger{background:#432a2c;color:#ffada0;border-color:#7d4445}
#toast{background:#203a35;color:#e3fff0;border:1px solid #367b5e;box-shadow:0 14px 38px #0008}
.errbox{background:#362929;color:#fac2b0;border:1px solid #854f45}
/* scrollbars unobtrusive, focus stays readable on small screens */
@media(max-width:390px){.v2-hero-inner{padding:22px 20px}.v2-hero h1{font-size:29px}.v2-hero-orbit{right:0;top:30px;font-size:69px}.v2-continue-left strong{font-size:21px}.v2-progress-card{padding:17px;gap:12px}.v2-progress-ring{width:84px;height:84px;flex-basis:84px}.v2-focus-body{padding:23px 16px 24px}.v2-reading-paper{padding:22px 19px}.v2-focus-dock{padding:13px 13px calc(11px + env(safe-area-inset-bottom))}.v2-giant-tap{min-height:82px;font-size:15px}.v2-minus{min-width:56px;width:56px}.v2-tab{font-size:11px;padding:10px 4px}}
@media(max-height:650px){.v2-focus-head{min-height:66px;padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:8px}.v2-focus-body{padding-top:17px}.v2-focus-body h1{font-size:26px;margin:10px 0 4px}.v2-focus-subtitle{margin-bottom:13px}.v2-tap-row .v2-giant-tap{min-height:68px}.v2-counter-top{margin-bottom:8px}.v2-focus-dock{padding-top:9px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}}
@media(min-width:800px){.v2-focus-page{border:1px solid #2a6050}.v2-prayer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* Final contrast refinements discovered in mobile render */
.v2-prayer.is-current{border:1px solid #33e4ae;background:linear-gradient(135deg,#174338 0%,#0a2a30 95%);color:#f1fcf6;box-shadow:0 0 0 1px #36e2ab36,0 16px 34px #11b98c1f}
.v2-progress-ring:before{background:#10262a;inset:10px}
.v2-progress-ring>div{background:transparent}
.v2-prayer.is-current .v2-prayer-details strong{color:#f7fff8}
.v2-prayer.is-current .v2-prayer-details small{color:#9ee3c2}

/* Reader accessibility — persistent font-size preference */
.v2-focus-page.reading-large .v2-reading-p{font-size:clamp(23px,6.2vw,27px);line-height:1.95}
.v2-focus-page.reading-large .v2-reading-paper.is-long .v2-reading-p{font-size:clamp(21px,5.4vw,23px)}
.v2-focus-page.reading-large .v2-reading-paper.is-arabic .v2-reading-p{font-size:clamp(32px,8.1vw,40px)}
.v2-focus-page.reading-large .v2-reading-paper.is-arabic.is-long .v2-reading-p{font-size:clamp(27px,7vw,33px)}
.v2-focus-min{font-size:20px;letter-spacing:-2px;font-weight:900;color:#81f5c6}
.v2-focus-min span{letter-spacing:0;margin-left:1px}
